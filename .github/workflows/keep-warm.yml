name: Keep Backend Warm

# The backend runs on Azure App Service's free F1 tier, which unloads the
# app after ~20 minutes of no requests (next request pays a 10-30s cold
# start), and the SQL Database's free-tier serverless compute auto-pauses
# similarly. Pinging a real API endpoint (not just a static page) every 10
# minutes keeps both warm — so a recruiter clicking the CV link gets an
# instant response, not a cold start, with zero infrastructure cost.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://cinepass-api-sachintha26.azurewebsites.net/api/v1/movies")
          echo "API responded with HTTP $code"
